<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>乡野共富内容工作台</title>
    <meta
      name="description"
      content="面向乡村助农与电商上新的内容生产工作台，展示产地故事、公益助农、素材生成、模板复用和成效看板。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231c2b22'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='34' fill='%23f2c14e' font-family='Arial'%3E%E7%94%B0%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scroll-meter" id="scrollMeter" aria-hidden="true"></div>
    <div class="site-shell">
      <aside class="sidebar">
        <div class="brand" aria-label="乡野共富内容工作台">
          <span class="brand-mark">田</span>
          <span>
            <strong>乡野共富内容工作台</strong>
            <em>助农上新 / 产地故事 / 公益传播</em>
          </span>
        </div>

        <nav class="nav" aria-label="主导航">
          <button class="nav-item active" data-page="home" type="button"><span>⌂</span>首页总览</button>
          <button class="nav-item" data-page="products" type="button"><span>▧</span>助农商品</button>
          <button class="nav-item" data-page="story" type="button"><span>✦</span>产地故事</button>
          <button class="nav-item" data-page="generator" type="button"><span>✎</span>内容生成</button>
          <button class="nav-item" data-page="templates" type="button"><span>▦</span>模板工坊</button>
          <button class="nav-item" data-page="tech" type="button"><span>⌘</span>技术架构</button>
          <button class="nav-item" data-page="motion" type="button"><span>◎</span>动效实验</button>
          <button class="nav-item" data-page="pipeline" type="button"><span>⟲</span>智能流程</button>
          <button class="nav-item" data-page="impact" type="button"><span>◈</span>共富看板</button>
        </nav>

        <section class="sidebar-card">
          <p class="eyebrow">价值导向</p>
          <strong>诚信助农、绿色发展、共同富裕</strong>
          <span>用数字内容帮助优质农产品被看见。</span>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="pageKicker">Rural Commerce Studio</p>
            <h1 id="pageTitle">首页总览</h1>
          </div>
          <div class="top-actions">
            <button class="ghost-btn" id="resetDemo" type="button">重置演示</button>
            <button class="primary-btn" id="jumpGenerate" type="button">生成助农文案</button>
          </div>
        </header>

        <section id="pageRoot" class="page-root" aria-live="polite"></section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
